<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Atividade - Validações</title>
    <link rel="stylesheet" href="../css/style.css">
</head>
<body>

<form id="form-inscricao">

    <h2>Dados do Usuário</h2>

    <label>Nome:</label>
    <input type="text" id="nome">
    <br><br>

    <label>Idade:</label>
    <input type="number" id="idade">
    <br><br>

    <label>Nível de experiência (1 a 10):</label>
    <input type="number" id="nivel">
    <br><br>

    <button type="button" onclick="validarBouncer()">
        Verificar Dados (Bouncer)
    </button>

    <hr>

    <h2>Promoção Especial</h2>

    <label>É estudante?</label>
    <input type="checkbox" id="estudante">
    <br><br>

    <button type="button" onclick="validarPromocao()">
        Verificar Promoção
    </button>

    <hr>

    <h2>Validador de Senha</h2>

    <label>Senha 1:</label>
    <input type="password" id="senha1">
    <br><br>

    <label>Senha 2:</label>
    <input type="password" id="senha2">
    <br><br>

    <button type="button" onclick="validarSenha()">
        Validar Senha
    </button>

    <hr>

    <h2>Categoria</h2>

    <button type="button" onclick="validar()">
        Validar Categoria
    </button>

</form>

<br>
<p id="mensagem"></p>

<script src="../javascript/script.js"></script>

</body>
</html>
